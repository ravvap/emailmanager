spring:
  application:
    name: tip-email-manager-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: txn
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:00000000-0000-0000-0000-000000000000}/v2.0}
          jwk-set-uri: ${AZURE_AD_JWK_SET_URI:https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:00000000-0000-0000-0000-000000000000}/discovery/v2.0/keys}


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    gov.fdic.tip.emailmanager: INFO

 

azure:
  activedirectory:
    tenant-id: ${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
    client-id: ${AZURE_CLIENT_ID:00000000-0000-0000-0000-000000000000}
    client-secret: ${AZURE_CLIENT_SECRET:your-client-secret-value}